# Render Blueprint Specification for Text Detective
# Documentation: https://render.com/docs/blueprint-spec
services:
  # Method A: Unified Docker Web Service (Single Container, Recommended for Free Tier)
  - type: web
    name: text-detective
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: LLM_PROVIDER
        value: mock
      - key: DEMO_MODE
        value: "true"
      # Optional: Add OPENAI_API_KEY or ANTHROPIC_API_KEY in Render Dashboard
