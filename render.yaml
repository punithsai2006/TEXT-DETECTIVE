# Render Blueprint Specification for Text Detective
# Documentation: https://render.com/docs/blueprint-spec
services:
  # Method A: Unified Docker Web Service (Single Container, Recommended for Free Tier)
  - type: web
    name: text-detective
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "false"
      # Enter an available model ID and API key in Render's environment settings.
      # For Anthropic, change LLM_PROVIDER and set ANTHROPIC_API_KEY instead.
